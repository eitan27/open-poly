<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Open Poly">
  <defs>
    <linearGradient id="lg-top" x1="8" y1="4" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f4f8" />
      <stop offset="1" stop-color="#dadae1" />
    </linearGradient>
    <linearGradient id="lg-left" x1="8" y1="18" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a9aa1" />
      <stop offset="1" stop-color="#6f6f76" />
    </linearGradient>
    <linearGradient id="lg-right" x1="32" y1="18" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a86ee" />
      <stop offset="1" stop-color="#0061c6" />
    </linearGradient>
  </defs>

  <g stroke="#1d1d1f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- three visible faces (same identity as the favicon) -->
    <path d="M32 4 L56 18 L32 32 L8 18 Z" fill="url(#lg-top)" />
    <path d="M8 18 L32 32 L32 60 L8 46 Z" fill="url(#lg-left)" />
    <path d="M32 32 L56 18 L56 46 L32 60 Z" fill="url(#lg-right)" />
  </g>

  <!-- crisp edge highlights along the top, for a more detailed read -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.1" stroke-linecap="round">
    <path d="M11 18 L32 30.5 L53 18" />
  </g>

  <!-- accent vertex point, echoing the app's selectable point marker -->
  <circle cx="32" cy="32" r="3" fill="#ffb000" stroke="#1d1d1f" stroke-width="1.4" />
</svg>
