name: Deploy landing page to GitHub Pages

# Publishes the static landing page in `landing/` to GitHub Pages.
# Pages must be enabled with "Source: GitHub Actions" in the repo settings.

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload landing page
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./landing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
