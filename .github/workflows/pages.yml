name: Deploy landing page to GitHub Pages

# Publishes the static landing page in `landing/` to GitHub Pages.
#
# DISABLED (auto-run): this repo is PRIVATE on the Free plan, where GitHub Pages
# cannot publish, so every auto-run fails red. The `push` trigger is commented
# out so it no longer runs on pushes. To RE-ENABLE once the repo is public OR on
# a paid plan (Pro/Team/Enterprise): uncomment the `push` block below and set
# Settings → Pages → Build and deployment → Source → "GitHub Actions". See the
# PLAN.md backlog. (`workflow_dispatch` is kept so it can still be run manually.)

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "landing/**"
  #     - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload landing page
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./landing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
