name: CI

# Lint, check formatting, type-check (tsc -b — the ONLY real typecheck here;
# the root tsconfig has files:[] so `tsc --noEmit` alone is a no-op), run the
# test suite, and build, on every push to main and every PR — so dangling
# references, type errors, and formatting drift can't slip in. The build step
# is separate from typecheck because it catches what only the production
# bundler sees, and it costs about a second.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Catches a commit carrying one of the maintainer's private email addresses,
  # whichever machine made it. The history was rewritten once to remove them; the
  # way that gets undone is a commit from an environment whose git identity was
  # never configured — a phone or cloud session, a fresh clone. GitHub's "block
  # command line pushes that expose my email" is the prevention; this is the part
  # that does not depend on remembering.
  #
  # It checks for those specific addresses, NOT for "is this a GitHub noreply", so
  # a contributor using their own real address is never blocked. The addresses live
  # in the PRIVATE_EMAILS secret, never in this repo; on a fork's pull request the
  # secret is absent and the step says so and passes, which is correct — a
  # contributor's own address is not what this guards against.
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit identity
        env:
          PRIVATE_EMAILS: ${{ secrets.PRIVATE_EMAILS }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch or a force-push gives no usable base; fall back to the tip.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            RANGE="$HEAD_SHA~1..$HEAD_SHA"
          else
            RANGE="$BASE..$HEAD_SHA"
          fi
          sh scripts/check-commit-identity.sh "$RANGE"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
